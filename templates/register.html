{% extends "base.html" %}

{% block title %}Register{% endblock  %}


{% block content %}
    <div class="centered-container">
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" aria-describedby="nameError">
                <div id="nameError" class="form-text error">This field is required</div>
              </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" aria-describedby="emailError">
              <div id="emailError" class="form-text error">This field is required</div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" aria-describedby="passwordError">
              <div id="passwordError" class="form-text error">This field is required</div>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" aria-describedby="confirmPasswordError">
                <div id="confirmPasswordError" class="form-text error">This field is required</div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
          </form>
    </div>
{% endblock  %}
